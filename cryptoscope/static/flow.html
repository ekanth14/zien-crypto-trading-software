<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zien Crypto // Capital Flow River & Sector Rotation</title>
  <link rel="stylesheet" href="/static/workspace.css">
  <style>
    .flow-container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 48px);
      background: #06080e;
      overflow: hidden;
    }
    .flow-top-metrics {
      height: 44px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
    }
    .flow-main-area {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 340px;
      min-height: 0;
    }
    .river-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-right: 1px solid var(--border);
    }
    .river-canvas-wrap {
      flex: 1;
      position: relative;
      background: #04060a;
    }
    .matrix-panel {
      background: var(--bg-panel);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow-y: auto;
    }
    .sector-rotation-strip {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: #090e18;
      display: flex;
      gap: 12px;
      overflow-x: auto;
    }
    .sector-card {
      background: var(--bg-subpanel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 12px;
      min-width: 140px;
    }
    .sector-name {
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
    }
    .sector-val {
      font-size: 14px;
      font-weight: 700;
      margin-top: 2px;
    }
    .matrix-section {
      padding: 12px;
    }
    .matrix-header {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .matrix-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .matrix-item {
      background: var(--bg-subpanel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .matrix-item:hover {
      background: var(--bg-hover);
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header class="top-nav">
    <div class="brand-section">
      <div class="brand-title">
        <span style="color: #06b6d4;">▲</span> ZIEN CRYPTO
        <span class="brand-tag">CAPITAL FLOW RIVER</span>
      </div>
    </div>

    <div class="nav-metrics">
      <div class="metric-pill">
        <span style="color: #94a3b8;">Funding Epoch:</span>
        <strong id="fundingEpoch" style="color: #f59e0b;">--:--:-- UTC</strong>
      </div>
      <div class="metric-pill">
        <span style="color: #94a3b8;">Dominance Flow:</span>
        <strong style="color: #38bdf8;">BTC → L1 → DeFi</strong>
      </div>
    </div>

    <div class="nav-actions">
      <a href="/bloomberg" class="nav-link">Bloomberg Terminal</a>
      <a href="/flow" class="nav-link active">Capital Flow River</a>
    </div>
  </header>

  <div class="flow-container">
    <!-- Top Metrics -->
    <div class="flow-top-metrics">
      <div style="display: flex; gap: 16px; align-items: center;">
        <span style="font-weight: 700; color: #f8fafc;">MARKET ROTATION TRAJECTORY</span>
        <span style="font-size: 11px; color: #64748b;">(Aggregated 30 Liquid Pairs)</span>
      </div>
      <div class="timeframe-selector">
        <button class="tf-btn" data-tf="1">1m</button>
        <button class="tf-btn active" data-tf="5">5m</button>
        <button class="tf-btn" data-tf="15">15m</button>
        <button class="tf-btn" data-tf="60">1h</button>
      </div>
    </div>

    <!-- Sector Rotation Strip -->
    <div id="sectorStrip" class="sector-rotation-strip">
      <!-- Populated via JS -->
    </div>

    <!-- Main Grid -->
    <div class="flow-main-area">
      <!-- Left: River Canvas -->
      <div class="river-panel">
        <div id="riverWrap" class="river-canvas-wrap">
          <canvas id="riverCanvas" style="width: 100%; height: 100%; display: block;"></canvas>
        </div>
      </div>

      <!-- Right: Dual Build-Up Matrix -->
      <aside class="matrix-panel">
        <div class="matrix-section">
          <div class="matrix-header" style="color: #10b981;">
            <span>🟢 LONG BUILD-UP (AGGRESSIVE)</span>
            <span id="longCount">0</span>
          </div>
          <div id="longMatrixList" class="matrix-list">
            <!-- Dynamic -->
          </div>
        </div>

        <div class="matrix-section" style="border-top: 1px solid var(--border);">
          <div class="matrix-header" style="color: #f43f5e;">
            <span>🔴 SHORT BUILD-UP (DISTRIBUTION)</span>
            <span id="shortCount">0</span>
          </div>
          <div id="shortMatrixList" class="matrix-list">
            <!-- Dynamic -->
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script type="module" src="/static/flow.js"></script>
</body>
</html>
