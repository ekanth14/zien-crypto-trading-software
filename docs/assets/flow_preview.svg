<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080e" />
      <stop offset="100%" stop-color="#0a0d16" />
    </linearGradient>
    <linearGradient id="btcStream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="l1Stream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="defiStream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="aiStream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: monospace; font-size: 13px; font-weight: 800; fill: #ffffff; letter-spacing: 1.5px; }
    .nav-pill { font-family: monospace; font-size: 10px; fill: #94a3b8; }
    .sec-title { font-family: monospace; font-size: 9px; fill: #64748b; text-transform: uppercase; }
    .sec-val { font-family: monospace; font-size: 14px; font-weight: 700; }
  </style>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#flowBg)" />

  <!-- Top Nav Bar -->
  <rect width="1200" height="48" fill="#0b101a" stroke="rgba(255,255,255,0.08)" />
  <g transform="translate(18, 28)">
    <polygon points="0,-10 8,4 -8,4" fill="#06b6d4" />
    <text x="16" y="0" class="title">ZIEN CRYPTO // CAPITAL FLOW RIVER</text>
  </g>

  <g transform="translate(550, 14)">
    <rect width="180" height="22" rx="4" fill="#131b2a" stroke="rgba(255,255,255,0.08)" />
    <text x="12" y="15" class="nav-pill">Funding Epoch: <tspan fill="#f59e0b" font-weight="700">03:42:15 UTC</tspan></text>

    <rect x="190" y="0" width="190" height="22" rx="4" fill="#131b2a" stroke="rgba(255,255,255,0.08)" />
    <text x="12" y="15" class="nav-pill" transform="translate(190, 0)">Rotation: <tspan fill="#38bdf8" font-weight="700">BTC → L1 → DeFi</tspan></text>
  </g>

  <!-- Sector Rotation Strip -->
  <g transform="translate(18, 58)">
    <!-- Card 1: Bitcoin -->
    <rect width="170" height="64" rx="4" fill="#0d121d" stroke="rgba(255,255,255,0.08)" />
    <circle cx="16" cy="18" r="4" fill="#f59e0b" />
    <text x="26" y="21" class="sec-title">STORE OF VALUE</text>
    <text x="16" y="44" class="sec-val" fill="#10b981">+0.55%</text>
    <text x="16" y="58" font-family="monospace" font-size="9px" fill="#64748b">Score: <tspan fill="#f8fafc">72</tspan> | Inflow</text>

    <!-- Card 2: Layer 1 -->
    <g transform="translate(180, 0)">
      <rect width="170" height="64" rx="4" fill="#0d121d" stroke="rgba(255,255,255,0.08)" />
      <circle cx="16" cy="18" r="4" fill="#06b6d4" />
      <text x="26" y="21" class="sec-title">LAYER 1</text>
      <text x="16" y="44" class="sec-val" fill="#10b981">+1.48%</text>
      <text x="16" y="58" font-family="monospace" font-size="9px" fill="#64748b">Score: <tspan fill="#f8fafc">76</tspan> | SUI, ETH Lead</text>
    </g>

    <!-- Card 3: DeFi -->
    <g transform="translate(360, 0)">
      <rect width="170" height="64" rx="4" fill="#0d121d" stroke="rgba(255,255,255,0.08)" />
      <circle cx="16" cy="18" r="4" fill="#a855f7" />
      <text x="26" y="21" class="sec-title">DEFI</text>
      <text x="16" y="44" class="sec-val" fill="#10b981">+2.15%</text>
      <text x="16" y="58" font-family="monospace" font-size="9px" fill="#64748b">Score: <tspan fill="#f8fafc">68</tspan> | UNI, AAVE</text>
    </g>

    <!-- Card 4: AI & Big Data -->
    <g transform="translate(540, 0)">
      <rect width="170" height="64" rx="4" fill="#0d121d" stroke="rgba(255,255,255,0.08)" />
      <circle cx="16" cy="18" r="4" fill="#10b981" />
      <text x="26" y="21" class="sec-title">AI &amp; BIG DATA</text>
      <text x="16" y="44" class="sec-val" fill="#10b981">+3.20%</text>
      <text x="16" y="58" font-family="monospace" font-size="9px" fill="#64748b">Score: <tspan fill="#f8fafc">81</tspan> | High Momentum</text>
    </g>

    <!-- Card 5: Meme -->
    <g transform="translate(720, 0)">
      <rect width="170" height="64" rx="4" fill="#0d121d" stroke="rgba(255,255,255,0.08)" />
      <circle cx="16" cy="18" r="4" fill="#f43f5e" />
      <text x="26" y="21" class="sec-title">MEME SECTOR</text>
      <text x="16" y="44" class="sec-val" fill="#f43f5e">-0.65%</text>
      <text x="16" y="58" font-family="monospace" font-size="9px" fill="#64748b">Score: <tspan fill="#f8fafc">44</tspan> | Outflow</text>
    </g>
  </g>

  <!-- Main Area: River Canvas & Matrix -->
  <!-- Left River Canvas (Width 820px) -->
  <g transform="translate(18, 134)">
    <rect width="872" height="530" fill="#04060a" stroke="rgba(255,255,255,0.08)" />
    
    <!-- Grid -->
    <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
      <line x1="0" y1="130" x2="872" y2="130" />
      <line x1="0" y1="265" x2="872" y2="265" stroke-dasharray="4,4" />
      <line x1="0" y1="400" x2="872" y2="400" />
      <line x1="200" y1="0" x2="200" y2="530" />
      <line x1="400" y1="0" x2="400" y2="530" />
      <line x1="600" y1="0" x2="600" y2="530" />
    </g>

    <text x="14" y="24" font-family="monospace" font-size="10px" fill="#64748b">AGGRESSIVE INFLOW (SCORE 100)</text>
    <text x="14" y="260" font-family="monospace" font-size="10px" fill="#64748b">EQUILIBRIUM (SCORE 50)</text>
    <text x="14" y="515" font-family="monospace" font-size="10px" fill="#64748b">AGGRESSIVE OUTFLOW (SCORE 0)</text>

    <!-- Flow Streams -->
    <!-- BTC Stream (Amber) -->
    <path d="M 0 280 C 200 240, 450 180, 800 140" stroke="url(#btcStream)" stroke-width="3.5" fill="none" opacity="0.9" />
    <text x="805" y="144" font-family="monospace" font-size="11px" font-weight="700" fill="#f59e0b">BTC</text>

    <!-- ETH Stream (Cyan) -->
    <path d="M 0 265 C 220 230, 480 150, 800 120" stroke="url(#l1Stream)" stroke-width="3" fill="none" opacity="0.85" />
    <text x="805" y="124" font-family="monospace" font-size="11px" font-weight="700" fill="#06b6d4">ETH</text>

    <!-- SUI Stream (Emerald) -->
    <path d="M 0 310 C 250 280, 500 120, 800 90" stroke="url(#aiStream)" stroke-width="2.5" fill="none" opacity="0.85" />
    <text x="805" y="94" font-family="monospace" font-size="11px" font-weight="700" fill="#10b981">SUI</text>

    <!-- UNI Stream (Purple) -->
    <path d="M 0 250 C 220 270, 470 210, 800 180" stroke="url(#defiStream)" stroke-width="2" fill="none" opacity="0.75" />
    <text x="805" y="184" font-family="monospace" font-size="11px" font-weight="700" fill="#a855f7">UNI</text>

    <!-- DOGE Stream (Red) -->
    <path d="M 0 240 C 200 260, 450 320, 800 370" stroke="#f43f5e" stroke-width="2" fill="none" opacity="0.7" />
    <text x="805" y="374" font-family="monospace" font-size="11px" font-weight="700" fill="#f43f5e">DOGE</text>
  </g>

  <!-- Right: Dual Build-Up Matrix (Width 280px) -->
  <g transform="translate(902, 134)">
    <rect width="280" height="530" fill="#0d121d" stroke="rgba(255,255,255,0.08)" />
    
    <!-- Long Buildup Section -->
    <g transform="translate(14, 16)">
      <text x="0" y="14" font-family="monospace" font-size="11px" font-weight="700" fill="#10b981">🟢 LONG BUILD-UP</text>
      <text x="210" y="14" font-family="monospace" font-size="11px" font-weight="700" fill="#10b981">8</text>

      <!-- Items -->
      <g transform="translate(0, 26)">
        <rect width="252" height="38" rx="3" fill="#131b2a" stroke="rgba(16,185,129,0.2)" />
        <text x="10" y="24" font-family="monospace" font-size="11px" font-weight="700" fill="#ffffff">BTCUSDT</text>
        <text x="90" y="24" font-family="monospace" font-size="10px" fill="#10b981">+0.55%</text>
        <rect x="210" y="8" width="32" height="20" rx="2" fill="rgba(16,185,129,0.2)" />
        <text x="218" y="22" font-family="monospace" font-size="10px" font-weight="700" fill="#10b981">72</text>
      </g>

      <g transform="translate(0, 70)">
        <rect width="252" height="38" rx="3" fill="#131b2a" stroke="rgba(16,185,129,0.2)" />
        <text x="10" y="24" font-family="monospace" font-size="11px" font-weight="700" fill="#ffffff">ETHUSDT</text>
        <text x="90" y="24" font-family="monospace" font-size="10px" fill="#10b981">+1.12%</text>
        <rect x="210" y="8" width="32" height="20" rx="2" fill="rgba(16,185,129,0.2)" />
        <text x="218" y="22" font-family="monospace" font-size="10px" font-weight="700" fill="#10b981">76</text>
      </g>

      <g transform="translate(0, 114)">
        <rect width="252" height="38" rx="3" fill="#131b2a" stroke="rgba(16,185,129,0.2)" />
        <text x="10" y="24" font-family="monospace" font-size="11px" font-weight="700" fill="#ffffff">SUIUSDT</text>
        <text x="90" y="24" font-family="monospace" font-size="10px" fill="#10b981">+4.20%</text>
        <rect x="210" y="8" width="32" height="20" rx="2" fill="rgba(16,185,129,0.2)" />
        <text x="218" y="22" font-family="monospace" font-size="10px" font-weight="700" fill="#10b981">84</text>
      </g>
    </g>

    <!-- Short Buildup Section -->
    <g transform="translate(14, 280)">
      <line x1="-14" y1="-10" x2="266" y2="-10" stroke="rgba(255,255,255,0.08)" />
      <text x="0" y="14" font-family="monospace" font-size="11px" font-weight="700" fill="#f43f5e">🔴 SHORT BUILD-UP</text>
      <text x="210" y="14" font-family="monospace" font-size="11px" font-weight="700" fill="#f43f5e">4</text>

      <!-- Items -->
      <g transform="translate(0, 26)">
        <rect width="252" height="38" rx="3" fill="#131b2a" stroke="rgba(244,63,94,0.2)" />
        <text x="10" y="24" font-family="monospace" font-size="11px" font-weight="700" fill="#ffffff">DOGEUSDT</text>
        <text x="90" y="24" font-family="monospace" font-size="10px" fill="#f43f5e">-0.65%</text>
        <rect x="210" y="8" width="32" height="20" rx="2" fill="rgba(244,63,94,0.2)" />
        <text x="218" y="22" font-family="monospace" font-size="10px" font-weight="700" fill="#f43f5e">32</text>
      </g>

      <g transform="translate(0, 70)">
        <rect width="252" height="38" rx="3" fill="#131b2a" stroke="rgba(244,63,94,0.2)" />
        <text x="10" y="24" font-family="monospace" font-size="11px" font-weight="700" fill="#ffffff">AVAXUSDT</text>
        <text x="90" y="24" font-family="monospace" font-size="10px" fill="#f43f5e">-1.05%</text>
        <rect x="210" y="8" width="32" height="20" rx="2" fill="rgba(244,63,94,0.2)" />
        <text x="218" y="22" font-family="monospace" font-size="10px" font-weight="700" fill="#f43f5e">28</text>
      </g>
    </g>
  </g>
</svg>
