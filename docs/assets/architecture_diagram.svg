<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#0c121e" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="bullGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 24px; font-weight: 800; fill: #ffffff; letter-spacing: 2px; }
    .subtitle { font-family: monospace; font-size: 13px; fill: #94a3b8; letter-spacing: 1px; }
    .card-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; letter-spacing: 0.5px; }
    .card-text { font-family: monospace; font-size: 11px; fill: #cbd5e1; line-height: 1.5; }
    .pill-text { font-family: monospace; font-size: 10px; font-weight: 700; }
    .border-glow { stroke: rgba(6, 182, 212, 0.4); stroke-width: 1.5; }
  </style>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bgGrad)" />

  <!-- Grid Pattern -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="170" x2="1200" y2="170" />
    <line x1="0" y1="340" x2="1200" y2="340" />
    <line x1="0" y1="510" x2="1200" y2="510" />
    <line x1="300" y1="0" x2="300" y2="680" />
    <line x1="600" y1="0" x2="600" y2="680" />
    <line x1="900" y1="0" x2="900" y2="680" />
  </g>

  <!-- Header -->
  <g transform="translate(60, 48)">
    <circle cx="12" cy="12" r="10" fill="#06b6d4" opacity="0.2" />
    <polygon points="12,4 19,17 5,17" fill="#06b6d4" />
    <text x="32" y="20" class="title">ZIEN CRYPTO // SYSTEM ARCHITECTURE</text>
    <text x="32" y="40" class="subtitle">Zero-External-Dependency Pure Python 3.12+ Standard Library Backend &amp; High-DPI Canvas</text>
  </g>

  <!-- Layer 1: Data Ingestion (Scraper) -->
  <g transform="translate(60, 120)">
    <rect width="240" height="230" rx="8" fill="url(#boxGrad)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1.5" />
    <rect x="0" y="0" width="240" height="36" rx="8" fill="#0f172a" />
    <text x="16" y="24" class="card-title">1. PUBLIC MARKET SCRAPER</text>
    
    <text x="16" y="65" class="card-text">Direct Binance REST endpoints</text>
    <text x="16" y="85" class="card-text">• /api/v3/ticker/24hr (Spot)</text>
    <text x="16" y="105" class="card-text">• /api/v3/klines (Taker Delta)</text>
    <text x="16" y="125" class="card-text">• /fapi/v1/fundingRate (Perps)</text>
    
    <rect x="16" y="150" width="208" height="60" rx="4" fill="#080e18" stroke="rgba(255,255,255,0.06)" />
    <text x="26" y="172" class="card-text" fill="#10b981">⚡ Zero API Keys Required</text>
    <text x="26" y="192" class="card-text">Parallel Pool: 8 Workers (&lt;500ms)</text>
  </g>

  <!-- Layer 2: Quantitative Engine -->
  <g transform="translate(340, 120)">
    <rect width="260" height="230" rx="8" fill="url(#boxGrad)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="36" rx="8" fill="#0f172a" />
    <text x="16" y="24" class="card-title" fill="#34d399">2. QUANTITATIVE ENGINE</text>
    
    <text x="16" y="65" class="card-text">• Wilder Smoothed RSI(14)</text>
    <text x="16" y="85" class="card-text">• Wilder Smoothed ATR(14)</text>
    <text x="16" y="105" class="card-text">• EMAs (9, 21, 50, 200)</text>
    <text x="16" y="125" class="card-text">• CVD = 2·TakerBuy - Vol</text>
    <text x="16" y="145" class="card-text">• Bullish Absorption / Exhaustion</text>
    <text x="16" y="165" class="card-text">• ICT Order Blocks &amp; FVGs</text>

    <rect x="16" y="185" width="228" height="30" rx="4" fill="rgba(16, 185, 129, 0.1)" />
    <text x="26" y="204" class="card-text" fill="#34d399">Mathematical Standard Reference</text>
  </g>

  <!-- Layer 3: Decision Engine & Gatekeeper -->
  <g transform="translate(640, 120)">
    <rect width="240" height="230" rx="8" fill="url(#boxGrad)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" />
    <rect x="0" y="0" width="240" height="36" rx="8" fill="#0f172a" />
    <text x="16" y="24" class="card-title" fill="#fbbf24">3. DECISION &amp; R:R GATE</text>
    
    <text x="16" y="65" class="card-text">0-100 Composite Score:</text>
    <text x="16" y="85" class="card-text">• Trend (25%) | Mom (20%)</text>
    <text x="16" y="105" class="card-text">• CVD Flow (25%) | Perp (15%)</text>
    <text x="16" y="125" class="card-text">• SMC Structure (15%)</text>
    
    <rect x="16" y="145" width="208" height="65" rx="4" fill="#181307" stroke="rgba(245, 158, 11, 0.3)" />
    <text x="26" y="168" class="card-text" fill="#f59e0b">🛡️ Institutional R:R Gate:</text>
    <text x="26" y="188" class="card-text" fill="#ffffff">Requires R:R ≥ 1.50 or AVOID</text>
  </g>

  <!-- Layer 4: AI Copilot (Ollama Gemma-4) -->
  <g transform="translate(920, 120)">
    <rect width="220" height="230" rx="8" fill="url(#boxGrad)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5" />
    <rect x="0" y="0" width="220" height="36" rx="8" fill="#0f172a" />
    <text x="16" y="24" class="card-title" fill="#c084fc">4. LAYA AI COPILOT</text>
    
    <text x="16" y="65" class="card-text">Local Ollama Engine</text>
    <text x="16" y="85" class="card-text">• Model: laya-crypto:latest</text>
    <text x="16" y="105" class="card-text">• Fine-tuned on Gemma-4 12B</text>
    <text x="16" y="125" class="card-text">• Live context injection</text>
    <text x="16" y="145" class="card-text">• Anti-hallucination bounds</text>

    <rect x="16" y="168" width="188" height="42" rx="4" fill="#1e102e" stroke="rgba(168, 85, 247, 0.3)" />
    <text x="24" y="194" class="card-text" fill="#e879f9">Deterministic Fallback</text>
  </g>

  <!-- Arrows -->
  <g stroke="#06b6d4" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M 300 235 L 340 235" />
    <path d="M 600 235 L 640 235" />
    <path d="M 880 235 L 920 235" />
  </g>

  <!-- Bottom Tier: UI Presentation & Client Runtime -->
  <g transform="translate(60, 390)">
    <rect width="1080" height="230" rx="8" fill="url(#boxGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
    <rect x="0" y="0" width="1080" height="38" rx="8" fill="#0f172a" />
    <text x="20" y="25" class="card-title" fill="#ffffff">5. PURE HTML5 CANVAS &amp; VANILLA ES6 CLIENT RUNTIME (ZERO NODE.JS BUILD STEP)</text>

    <!-- UI Component 1 -->
    <g transform="translate(20, 55)">
      <rect width="320" height="150" rx="6" fill="#090e18" stroke="rgba(6, 182, 212, 0.2)" />
      <text x="14" y="24" class="card-title">Bloomberg Terminal Grid</text>
      <text x="14" y="50" class="card-text">• High-density typography &amp; layout</text>
      <text x="14" y="70" class="card-text">• 4-Quadrant Leverage Matrix</text>
      <text x="14" y="90" class="card-text">• Perpetual Epoch Countdown Clock</text>
      <text x="14" y="110" class="card-text">• Real-time Ticker Marquee Ribbon</text>
      <text x="14" y="130" class="card-text">• 30 Liquid Pairs Screener Table</text>
    </g>

    <!-- UI Component 2 -->
    <g transform="translate(360, 55)">
      <rect width="340" height="150" rx="6" fill="#090e18" stroke="rgba(16, 185, 129, 0.2)" />
      <text x="14" y="24" class="card-title" fill="#34d399">High-DPI Interactive Chart</text>
      <text x="14" y="50" class="card-text">• Multi-timeframe Candlesticks (1m, 5m, 15m, 1h)</text>
      <text x="14" y="70" class="card-text">• ICT Order Block Boxes &amp; Midlines</text>
      <text x="14" y="90" class="card-text">• Fair Value Gap (FVG) Shaded Zones</text>
      <text x="14" y="110" class="card-text">• Volume &amp; Cumulative Volume Delta (CVD)</text>
      <text x="14" y="130" class="card-text">• Synchronized Multi-pane Crosshairs</text>
    </g>

    <!-- UI Component 3 -->
    <g transform="translate(720, 55)">
      <rect width="340" height="150" rx="6" fill="#090e18" stroke="rgba(168, 85, 247, 0.2)" />
      <text x="14" y="24" class="card-title" fill="#c084fc">Capital Flow River &amp; Security</text>
      <text x="14" y="50" class="card-text">• Dynamic Sector Flow Streams</text>
      <text x="14" y="70" class="card-text">• Sector Rotation Cards (L1, L2, DeFi, AI, Meme)</text>
      <text x="14" y="90" class="card-text">• Single-Owner Admin PBKDF2 Hashing</text>
      <text x="14" y="110" class="card-text">• TOTP 2FA Authenticator Support</text>
      <text x="14" y="130" class="card-text">• Sliding-Window Rate Limiters</text>
    </g>
  </g>

</svg>
